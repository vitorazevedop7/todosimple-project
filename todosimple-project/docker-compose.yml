version: "3.8"

services:
  mysqldb:
    # CODE REVIEW [DEPENDÊNCIA DESATUALIZADA]: MySQL 5.7 chegou ao fim de suporte (EOL) em outubro/2023.
    # Usar versões sem suporte representa risco de segurança pois vulnerabilidades descobertas
    # não recebem mais correções oficiais.
    # Sugestão: atualizar para mysql:8.0 ou mysql:8.4 (LTS).
    # Atenção: MySQL 8 mudou o plugin de autenticação padrão (caching_sha2_password).
    # Pode ser necessário adicionar: command: --default-authentication-plugin=mysql_native_password
    image: mysql:5.7
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQLDB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQLDB_DATABASE}
    ports:
      - "${MYSQLDB_LOCAL_PORT}:${MYSQLDB_DOCKER_PORT}"
    volumes:
      - db-data:/var/lib/mysql

  backend:
    build:
      context: ./todosimple-backend
      dockerfile: Dockerfile
    depends_on:
      - mysqldb
    env_file: ./.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:${MYSQLDB_DOCKER_PORT}/${MYSQLDB_DATABASE}?useSSL=false&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQLDB_ROOT_PASSWORD}
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"

  frontend:
    build: ./todosimple-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:${SPRING_DOCKER_PORT}

volumes:
  db-data:
